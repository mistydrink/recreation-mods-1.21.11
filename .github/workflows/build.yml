name: Build mods

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build all three mods
        run: |
          set -e
          for mod in deathkick nickskins smptools; do
            echo "::group::Building $mod"
            (cd "$mod" && chmod +x gradlew && ./gradlew build --no-daemon --stacktrace)
            echo "::endgroup::"
          done
          mkdir -p jars
          cp */build/libs/*.jar jars/

      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: jars/*.jar

