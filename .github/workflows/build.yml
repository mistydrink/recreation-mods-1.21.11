name: Build mods
 
on:
  push:
    branches-ignore: [jars]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
 
      - name: Pin latest Yarn mappings
        run: |
          # gradle.properties may say e.g. yarn_mappings=1.21.11+build.+ ; Gradle can't resolve that,
          # so look up the newest build for that Minecraft version and write it in.
          for f in $(find . -path ./.git -prune -o -name gradle.properties -print); do
            if grep -q '^yarn_mappings=.*+build\.+$' "$f"; then
              mc=$(grep '^minecraft_version=' "$f" | cut -d= -f2 | tr -d '\r')
              v=$(curl -sf "https://meta.fabricmc.net/v2/versions/yarn/$mc" | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["version"])')
              sed -i "s/^yarn_mappings=.*/yarn_mappings=$v/" "$f"
              echo "$f: yarn $v"
            fi
          done

      - name: Build all three mods
        run: |
          set -e
          # Find the mod folders wherever they were uploaded (repo root or a subfolder).
          FOUND=$(find . -path ./.git -prune -o -type f -path '*/deathkick/build.gradle' -print | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "Could not find deathkick/build.gradle. This is what's in the repository:"
            find . -path ./.git -prune -o -print | head -n 100
            exit 1
          fi
          BASE=$(dirname "$(dirname "$FOUND")")
          echo "Mods found in: $BASE"
          mkdir -p "$GITHUB_WORKSPACE/jars"
          for mod in deathkick nickskins smptools; do
            echo "::group::Building $mod"
            (cd "$BASE/$mod" && chmod +x gradlew && ./gradlew build --no-daemon --stacktrace)
            cp "$BASE/$mod"/build/libs/*.jar "$GITHUB_WORKSPACE/jars/"
            echo "::endgroup::"
          done
 
      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: jars/*.jar

      - name: Save jars to the "jars" branch
        run: |
          # The jars branch only ever holds the latest build's jars, so they can be grabbed without
          # downloading the Actions artifact. [skip ci] stops this push from starting another build.
          cd "$GITHUB_WORKSPACE/jars"
          git init -q
          git checkout -q -b jars
          git add *.jar
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Jars from ${GITHUB_REF_NAME} ${GITHUB_SHA::7} [skip ci]"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" jars
